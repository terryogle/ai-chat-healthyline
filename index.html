<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthyLine22 AI Chat</title>

  <link href="https://unpkg.com/tt-chat-n8n/dist/style.css" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #2196f3;
    }

    .options-panel {
      background-color: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    button {
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #0d8bf2;
    }

    #tt-chat-n8n {
      margin-top: 20px;
    }
  </style>

</head>


<body>

<div class="container">

  <h1>HealthyLine AI Assistant</h1>

  <div class="options-panel">

    <h2>AI Chat</h2>

    <p>
      Ask questions and get help from our AI assistant.
    </p>

    <button id="initChat">
      Start Chat
    </button>

  </div>

  <div id="tt-chat-n8n"></div>

</div>


<script src="https://unpkg.com/tt-chat-n8n/dist/tt-chat.umd.js"></script>


<script>

document.getElementById('initChat').addEventListener('click', function () {

  TTChatN8N.createChat({

    webhookUrl: 'https://app.healthyline.com/webhook/ai-chat',

    target: '#tt-chat-n8n',

    mode: 'window',

    title: 'HealthyLine AI Assistant',

    subtitle: 'How can I help you?',

    placeholder: 'Type your message...',

    initialMessages: [
      'Hello! 👋',
      'How can I help you today?'
    ],

    loadPreviousSession: true,

    showTooltip: true,

    tooltipText: 'Chat with AI'

  });

});

</script>


</body>

</html>
