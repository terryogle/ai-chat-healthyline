<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourtools Chat N8N</title>
  
  <!-- Пути БЕЗ ./dist/, так как index.html уже внутри папки dist -->
  <link rel="stylesheet" href="./style.css">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      text-align: center;
    }
    h1 { color: #333; }
    p { color: #666; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Чат-бот готов к работе!</h1>
    <p>Нажми на синюю кнопку в правом нижнем углу, чтобы начать общение.</p>
  </div>

  <!-- Подключаем скрипт БЕЗ ./dist/ -->
  <script src="./tt-chat.bundle.umd.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      TTChatN8N.createChat({
        // ВРЕМЕННАЯ ЗАГЛУШКА
        webhookUrl: 'https://example.com/webhook/test', 
        
        mode: 'window',
        title: 'Tourtools Support',
        subtitle: 'Как я могу помочь?',
        placeholder: 'Напишите сообщение...',
        initialMessages: ['Привет! 👋', 'Я готов отвечать на вопросы.'],
        loadPreviousSession: true,
        showTooltip: true,
        tooltipText: "Нажми, чтобы написать нам"
      });
    });
  </script>
</body>
</html>
