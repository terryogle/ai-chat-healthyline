<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourTools Chat N8N</title>
  <meta name="description" content="A simplified chat widget for n8n workflows and TourTools integrations">
  <meta property="og:title" content="TourTools Chat N8N">
  <meta property="og:description" content="A simplified chat widget for n8n workflows and TourTools integrations">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #111827;
    }
    .options-panel {
      background-color: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    button {
      background-color: #111827;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0d8bf2;
    }
    #tt-chat-n8n {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Development Environment</h1>
    
    <div class="options-panel">
      <h2>Configurazione</h2>
      <p>Modificare le opzioni di <strong>createChat()</strong> per testare le opzioni</p>
      <p>Eseguire l'ambiente di dev con 
        <code>npm run dev</code>
      </p>
      <p>
        Il workflow di test utilizza i comandi speciali markdown e action
      </p>
      
      <button id="initChat">Inizializza la chat</button>
    </div>
    
    <div id="tt-chat-n8n"></div>
  </div>

  <script type="module">
    import { createChat } from './src/main.ts';
    
    const VITE_WEBHOOK = import.meta.env?.VITE_WEBHOOK_URL;
    const REAL_WEBHOOK_URL = VITE_WEBHOOK || 'https://app.healthyline.com/webhook/ai-chat';
    const DEMO_WEBHOOK_URL = '/api/webhook';
    const ACTIVE_WEBHOOK_URL = VITE_WEBHOOK || REAL_WEBHOOK_URL || DEMO_WEBHOOK_URL;

    function startChat() {
      if (typeof window.SimpleChatN8N !== 'undefined') {
        window.SimpleChatN8N.createChat({
          title: "HealthyLine",
          subtitle: "Chat with AI Assistant",
          placeholder: "Type your message...",
          tooltipText: "Got questions? We're here 24/7",
          webhookUrl: ACTIVE_WEBHOOK_URL,
          loadPreviousSession: true,
          showTooltip: true,
          icons: {
            headerLogo: "https://healthyline.com/images/logo.svg"
          }
        });
      } else {
        createChat({
          webhookUrl: ACTIVE_WEBHOOK_URL,
          mode: 'window',
          title: 'HealthyLine',
          subtitle: 'Chat with AI Assistant',
          placeholder: 'Type your message...',
          initialMessages: [],
          loadPreviousSession: true,
          showTooltip: true,
          tooltipText: "Got questions? We're here 24/7",
          icons: {
            headerLogo: "https://healthyline.com/images/logo.svg"
          }
        });
      }
    }

    document.getElementById('initChat').addEventListener('click', startChat);
    
    // Auto initialize on load
    startChat();
  </script>
</body>
</html>
