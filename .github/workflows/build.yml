name: Build Widget

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Build widget
        run: npm run build

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: tt-chat-build
          path: dist
