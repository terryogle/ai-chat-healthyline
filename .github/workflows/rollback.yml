name: Rollback Production Version

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target semantic version to rollback to (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Perform rollback
        run: node scripts/rollback.js ${{ github.event.inputs.target_version }}

      - name: Commit restored production assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "rollback(production): revert to v${{ github.event.inputs.target_version }} [skip ci]"
          git push
